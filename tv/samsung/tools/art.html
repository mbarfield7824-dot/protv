<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #04060c; }
  .icon { position: relative; width: 512px; height: 423px; overflow: hidden;
    background: radial-gradient(420px 320px at 50% 38%, #163a9c 0%, #0a1a4d 38%, #04060c 78%); font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  .icon::before { content: ''; position: absolute; left: -40px; right: -40px; bottom: -120px; height: 220px;
    background: radial-gradient(closest-side, rgba(96,165,250,.35), rgba(96,165,250,0)); }
  .mark { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font-weight: 800; font-size: 124px; letter-spacing: -5px; color: #fff; line-height: 1;
    text-shadow: 0 10px 40px rgba(0,0,0,.55); }
  .mark i { color: #60a5fa; font-style: italic; letter-spacing: -4px; }
  .rule { position: absolute; left: 156px; right: 156px; top: 290px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(65,105,225,0), #4169e1 30%, #60a5fa 70%, rgba(96,165,250,0)); }
</style></head>
<body><div class="icon"><div class="mark">PRO<i>tv</i></div><div class="rule"></div></div></body></html>
