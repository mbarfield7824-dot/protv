<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
  <title>PROtv</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- Samsung product APIs (AVPlay, appcommon). Present only on Samsung TVs and the TV emulator. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="app">
    <div class="ambient" id="ambient"><div class="ambient-layer" id="ambient-a"></div><div class="ambient-layer" id="ambient-b"></div></div>
    <nav class="nav" id="nav" aria-label="PROtv"></nav>
    <main id="screen" aria-live="polite"></main>
    <div id="player" class="hidden">
      <object id="av-player" type="application/avplayer"></object>
      <div id="osd" class="osd"></div>
    </div>
    <div id="toast" role="status"></div>
    <div id="offline" class="hidden">You're offline. PROtv will reconnect automatically.</div>
    <div id="dialog" class="hidden" role="dialog"></div>
    <div id="splash">
      <img class="wordmark" src="img/logo-720.png" width="720" height="198" alt="PROtv">
      <div class="tagline">WHERE THE FIRE LIVES</div>
      <div class="spinner"></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/account.js"></script>
  <script src="js/http.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
